<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; color: #334155; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { font-size: 22px; text-align: center; margin-bottom: 20px; color: #0f172a; }
        .tile { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border-left: 5px solid #6366f1; display: flex; justify-content: space-between; align-items: center; }
        .tile-left { display: flex; flex-direction: column; gap: 4px; }
        .tile-time { font-size: 12px; font-weight: 700; text-transform: uppercase; color: #6366f1; letter-spacing: 0.5px; }
        .tile-title { font-size: 16px; font-weight: 600; color: #1e293b; }
        .tile-date { font-size: 13px; background: #f1f5f9; padding: 4px 8px; border-radius: 6px; color: #64748b; font-weight: 500; }
    </style>
</head>
<body>
<div class="container">
    <h1>Ближайшие мероприятия</h1>
    <div class="tile">
        <div class="tile-left">
            <span class="tile-time">18:00</span>
            <span class="tile-title">Синтез-практика</span>
        </div>
        <div class="tile-date">17 нояб.</div>
    </div>
    <div class="tile" style="border-left-color: #ec4899;">
        <div class="tile-left">
            <span class="tile-time" style="color: #ec4899;">20:00</span>
            <span class="tile-title">Разбор материалов</span>
        </div>
        <div class="tile-date">17 нояб.</div>
    </div>
</div>
</body>
</html>
